<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart POS System</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
    .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; border: 2px solid #007bff; }
    input, button { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    button.btn-success { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
    button.btn-primary { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; font-size: 16px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 85%; max-width: 400px; }
  </style>
</head>
<body>

<div class="container">
  <h2 style="text-align: center; color: #333; margin-top: 0;">ระบบคิดเงิน POS</h2>
  
  <!-- สแกนเนอร์พร้อมส่องตลอดเวลา -->
  <div id="reader"></div>

  <h3>รายการสินค้า</h3>
  <div id="cart"></div>
  <h3 style="color: #d9534f;">ยอดรวม: <span id="total-price">0</span> บาท</h3>
  <button class="btn-success" onclick="clearCart()">ชำระเงินเรียบร้อย</button>
</div>

<!-- ป๊อปอัปเด้งอัตโนมัติเมื่อเจอบาร์โค้ดใหม่ -->
<div id="new-product-modal" class="modal">
  <div class="modal-content">
    <h3 style="margin-top:0; color:#007bff;">พบสินค้าใหม่!</h3>
    <p>กรุณากรอกข้อมูลเพื่อบันทึกลงระบบ</p>
    <input type="text" id="p-barcode" readonly style="background: #e9ecef;">
    <input type="text" id="p-name" placeholder="ชื่อสินค้า">
    <input type="number" id="p-price" placeholder="ราคา (บาท)">
    <button class="btn-primary" onclick="saveProduct()">บันทึกสินค้า</button>
    <button style="background:#6c757d; color:white; border:none;" onclick="closeModal()">ยกเลิก</button>
  </div>
</div>

<script>
  // *** วาง Web App URL ของคุณในเครื่องหมายคำพูดด้านล่าง ***
  const API_URL = "https://stu15194-debug.github.io/my-pos-app/";

  let isScanning = true;
  let cart = [];

  function onScanSuccess(decodedText) {
    if (!isScanning) return; // ป้องกันการสแกนซ้ำขณะกำลังประมวลผล
    isScanning = false;

    // ส่งไปเช็กใน Google Sheets
    fetch(`${API_URL}?action=get&barcode=${decodedText}`)
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          // ถ้ามีสินค้า -> เพิ่มเข้าตะกร้าทันที
          cart.push(data);
          updateCart();
          setTimeout(() => { isScanning = true; }, 1500); // เว้นระยะ 1.5 วิ ก่อนสแกนชิ้นต่อไป
        } else {
          // ถ้าเป็นสินค้าใหม่ -> เด้งหน้าต่างเพิ่มสินค้าทันที
          document.getElementById('p-barcode').value = decodedText;
          document.getElementById('new-product-modal').style.display = 'flex';
        }
      })
      .catch(() => {
        isScanning = true;
      });
  }

  function updateCart() {
    const cartDiv = document.getElementById('cart');
    cartDiv.innerHTML = '';
    let total = 0;
    cart.forEach(item => {
      total += parseFloat(item.price);
      cartDiv.innerHTML += `<div class="cart-item"><span>${item.name}</span><span><b>${item.price}</b> บาท</span></div>`;
    });
    document.getElementById('total-price').innerText = total;
  }

  function clearCart() {
    if (cart.length === 0) return alert("ไม่มีสินค้าในตะกร้า");
    alert("ชำระเงินเรียบร้อย!");
    cart = [];
    updateCart();
  }

  function saveProduct() {
    const barcode = document.getElementById('p-barcode').value;
    const name = document.getElementById('p-name').value;
    const price = document.getElementById('p-price').value;

    if (!name || !price) return alert("กรุณากรอกชื่อและราคาให้ครบถ้วน");

    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ barcode, name, price })
    })
    .then(res => res.json())
    .then(data => {
      alert(data.message);
      // เพิ่มเข้าตะกร้าทันทีหลังบันทึกเสร็จ
      cart.push({ barcode, name, price });
      updateCart();
      closeModal();
    });
  }

  function closeModal() {
    document.getElementById('new-product-modal').style.display = 'none';
    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    setTimeout(() => { isScanning = true; }, 1000);
  }

  window.onload = () => {
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 } });
    html5QrcodeScanner.render(onScanSuccess);
  };
</script>

</body>
</html>
